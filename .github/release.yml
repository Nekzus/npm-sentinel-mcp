changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - octocat
  categories:
    - title: "🚀 Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - fix
        - bug
    - title: "🧰 Maintenance & Chores"
      labels:
        - chore
        - documentation
        - ci
  authors:
    - enabled: true
